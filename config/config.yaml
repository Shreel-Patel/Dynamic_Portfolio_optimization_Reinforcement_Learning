# Portfolio DRL — FE 529-B
tickers:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA

data:
  start: "2020-01-01"
  end: "2024-12-31"
  train_end: "2022-12-31"
  val_start: "2023-01-01"
  val_end: "2023-09-30"
  test_start: "2023-10-01"

environment:
  lookback: 20
  transaction_cost: 0.001  # 10 bps proportional to turnover
  risk_free_annual: 0.02

training:
  total_timesteps: 200000
  eval_freq: 5000
  seed: 42

agents:
  SAC:
    policy: MlpPolicy
    learning_rate: 3.0e-4
    buffer_size: 100000
    gamma: 0.99
    batch_size: 256
  DDPG:
    policy: MlpPolicy
    learning_rate: 1.0e-3
    buffer_size: 50000
    gamma: 0.99
    batch_size: 128
  PPO:
    policy: MlpPolicy
    learning_rate: 3.0e-4
    gamma: 0.99
    batch_size: 64

benchmarks:
  markowitz_lookback: 60
  equal_weight_freq: "ME"  # month-end rebalance

plots:
  rolling_sharpe_window: 90
